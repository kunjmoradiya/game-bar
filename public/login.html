<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d1b"><meta name="robots" content="noindex,nofollow"><title>Sign in · GAME HUB</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 15% 0,#29245e,transparent 40%),#090d1b;color:#f5f6ff;font:15px 'DM Sans',sans-serif}.card{width:min(430px,100%);padding:34px;background:#141d33;border:1px solid #2c3959;border-radius:22px;box-shadow:0 24px 80px #0008}.brand{font:700 22px 'Space Grotesk';margin-bottom:28px}.brand span{color:#a99aff}.brandmark{display:inline-grid;place-items:center;width:34px;height:34px;margin-right:9px;border-radius:10px;background:linear-gradient(135deg,#9b83ff,#4c8eff)}h1{font:700 30px 'Space Grotesk';margin:0 0 8px}.sub{color:#aab4d0;line-height:1.6;margin:0 0 25px}label{display:block;color:#cbd3e7;font-size:13px;margin:15px 0 7px}input{width:100%;height:48px;padding:0 13px;border-radius:10px;border:1px solid #354464;background:#0b1427;color:white;font:inherit}button{width:100%;height:48px;margin-top:13px;border:0;border-radius:10px;background:linear-gradient(110deg,#927bff,#598fff);color:white;font-weight:800;cursor:pointer}button.secondary{background:#283654}button:disabled{opacity:.5}.message{min-height:22px;margin-top:14px;color:#aab4d0;font-size:13px}.error{color:#ff9bad}.back{background:none;color:#c9c1ff;height:auto;padding:10px}.hidden{display:none!important}.foot{margin-top:24px;color:#8591af;font-size:12px;text-align:center}.foot a{color:#c7bdff;text-decoration:none}</style></head><body><main class="card"><div class="brand"><span class="brandmark">G</span>GAME<span>HUB</span></div><h1 id="title">Welcome back</h1><p class="sub" id="sub">Sign in or create your free account using an email verification code.</p><form id="form"><div id="emailRow"><label for="email">Email address</label><input id="email" type="email" required autocomplete="username webauthn" placeholder="you@example.com"></div><div id="codeRow" class="hidden"><label for="code">6-digit verification code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Enter code"></div><button id="submit">Continue with email</button><button id="google" type="button" class="secondary">Continue with Google</button><button id="back" type="button" class="back hidden">Use a different email</button></form><div id="passkey" class="hidden"><p class="sub">Add a passkey to sign in next time with your fingerprint, face or device screen lock.</p><button id="addPasskey">Add a passkey</button><button id="skipPasskey" class="secondary">Not now</button></div><p id="message" class="message" role="status"></p><div class="foot"><a href="/">← Back to GAME HUB</a></div></main><script>
(function(){const A=window.hatchable&&window.hatchable.auth,$=id=>document.getElementById(id);let step='email',email='',hasPasskey=false;function say(t,bad){$('message').textContent=t||'';$('message').className='message'+(bad?' error':'')}async function next(){try{const r=await fetch('/api/player',{cache:'no-store'});if(!r.ok)throw Error('Player identity setup failed.');const d=await r.json();say((d.player_id_created?'Welcome to GAME HUB! Your new permanent Player ID: ':'Your permanent GAME HUB Player ID: ')+d.player_id);const raw=new URLSearchParams(location.search).get('next')||'/';const target=raw[0]==='/'&&raw[1]!=='/'&&!raw.includes('\\')&&!/[\u0000-\u001f\u007f]/.test(raw)?raw:'/';setTimeout(()=>location.replace(target),900)}catch(e){say('Signed in, but Player ID setup did not finish. Please refresh or try again.',true)}}if(!A){say('Sign-in is unavailable. Refresh this page.',true);$('submit').disabled=true;return}A.getSession().then(s=>{if(s&&s.user)next()}).catch(()=>{});$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;try{if(step==='email'){email=$('email').value.trim();if(!email)throw Error('Enter your email.');const r=await A.startLogin({email});hasPasskey=!!r.has_passkey;if(hasPasskey&&A.supportsPasskeys()){try{await A.signInWithPasskey({email});next();return}catch(err){}}step='code';$('emailRow').classList.add('hidden');$('codeRow').classList.remove('hidden');$('back').classList.remove('hidden');$('title').textContent='Check your email';$('sub').textContent='Enter the 6-digit code sent to '+email+'.';$('submit').textContent='Verify and sign in';$('code').focus();say('Verification code sent.')}else{const r=await A.verifyCode({email,code:$('code').value.trim()});if(!r||!r.user)throw Error('Code could not be verified.');const identity=await fetch('/api/player',{cache:'no-store'});if(!identity.ok)throw Error('Your account is signed in, but Player ID setup failed. Please retry.');const identityData=await identity.json();if(!hasPasskey&&A.supportsPasskeys()&&localStorage.getItem('gh_passkey_declined')!=='1'){$('form').classList.add('hidden');$('passkey').classList.remove('hidden');$('title').textContent='Secure your account';$('sub').textContent='Your account is ready.';say('Your permanent GAME HUB Player ID: '+identityData.player_id)}else next()}}catch(err){say(err.message||'Please try again.',true)}finally{$('submit').disabled=false}};$('google').onclick=async()=>{try{const dest=new URLSearchParams(location.search).get('next')||'/';await A.signInWithGoogle({next:'/login?next='+encodeURIComponent(dest)})}catch(e){say(e.message||'Google sign-in is not available yet.',true)}};$('back').onclick=()=>{step='email';$('emailRow').classList.remove('hidden');$('codeRow').classList.add('hidden');$('back').classList.add('hidden');$('title').textContent='Welcome back';$('sub').textContent='Sign in or create your free account using an email verification code.';$('submit').textContent='Continue with email';say('')};$('addPasskey').onclick=async()=>{try{await A.registerPasskey();next()}catch(e){say(e.message||'Could not add passkey.',true)}};$('skipPasskey').onclick=()=>{localStorage.setItem('gh_passkey_declined','1');next()}})();
</script></body></html>
